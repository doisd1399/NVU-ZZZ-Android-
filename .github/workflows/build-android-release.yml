name: Build NVU R3.34 Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nvu-r3-34-release
  cancel-in-progress: false

jobs:
  build-release:
    name: Gerar APK Release Assinado
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ZIP_FILE: NVU-CAPACITOR-ANDROID-R3.34-GITHUB-RELEASE.zip
      EXPECTED_ZIP_SHA256: 0104e09805a861cb83e375acb129c94c198049dc050e5c054ef45edc2faa25aa

      EXPECTED_APPLICATION_ID: com.nvu.operacional
      EXPECTED_VERSION_CODE: "51"
      EXPECTED_VERSION_NAME: "1.0.51"

      EXPECTED_SIGNING_CERT_SHA256: "80:6A:03:EA:92:B6:9E:7F:9A:70:52:6E:9C:4D:6A:4A:E5:2E:C4:F9:CF:7C:AC:05:DD:B1:AA:28:08:42:46:EA"

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Validar ZIP R3.34
        shell: bash
        run: |
          set -euo pipefail

          test -f "$ZIP_FILE"

          ACTUAL_SHA="$(sha256sum "$ZIP_FILE" | awk '{print $1}')"

          echo "SHA esperado: $EXPECTED_ZIP_SHA256"
          echo "SHA recebido: $ACTUAL_SHA"

          if [ "$ACTUAL_SHA" != "$EXPECTED_ZIP_SHA256" ]; then
            echo "::error::O ZIP não corresponde à R3.34 certificada."
            exit 1
          fi

          echo "ZIP R3.34 validado."

      - name: Extrair projeto
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR="$GITHUB_WORKSPACE/extracted/NVU-CAPACITOR-ANDROID-R3.34"

          test -f "$PROJECT_DIR/package.json"
          test -f "$PROJECT_DIR/package-lock.json"
          test -d "$PROJECT_DIR/android"
          test -f "$PROJECT_DIR/android/gradlew"
          test -d "$PROJECT_DIR/functions"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Projeto extraído corretamente."

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Instalar dependências
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          npm ci
          npm --prefix functions ci

      - name: Executar certificação R3.34
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          npm run verify:release

      - name: Compilar Web e sincronizar Capacitor
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          npm run build
          npm run prepare:cap-assets
          npx cap sync android
          npm run verify:cap-assets

      - name: Validar identidade Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          grep -Fq 'applicationId "com.nvu.operacional"' android/app/build.gradle
          grep -Fq 'versionCode 51' android/app/build.gradle
          grep -Fq 'versionName "1.0.51"' android/app/build.gradle

          echo "Pacote: $EXPECTED_APPLICATION_ID"
          echo "Versão: $EXPECTED_VERSION_NAME"
          echo "versionCode: $EXPECTED_VERSION_CODE"

      - name: Compilar APK Release
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR/android"

          chmod +x gradlew

          ./gradlew --stop || true
          ./gradlew clean assembleRelease --no-daemon

      - name: Validar Secrets de assinatura
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for NAME in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD
          do
            if [ -z "${!NAME:-}" ]; then
              echo "::error::$NAME não foi configurado nos Secrets."
              exit 1
            fi
          done

          echo "Secrets encontrados."

      - name: Reconstruir keystore temporária
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          KEYSTORE_PATH="$RUNNER_TEMP/nvu-release.jks"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$KEYSTORE_PATH"

          test -s "$KEYSTORE_PATH"

          chmod 600 "$KEYSTORE_PATH"

          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Validar certificado da keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          EXPECTED="$(
            printf '%s' "$EXPECTED_SIGNING_CERT_SHA256" \
            | tr -d '[:space:]:-' \
            | tr '[:lower:]' '[:upper:]'
          )"

          ACTUAL="$(
            keytool \
              -list \
              -v \
              -keystore "$KEYSTORE_PATH" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -alias "$ANDROID_KEY_ALIAS" \
            | sed -n 's/.*SHA256: //p' \
            | head -n 1 \
            | tr -d '[:space:]:-' \
            | tr '[:lower:]' '[:upper:]'
          )"

          if [ -z "$ACTUAL" ]; then
            echo "::error::Não foi possível identificar o certificado da keystore."
            exit 1
          fi

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::A keystore não corresponde à chave oficial da NVU."
            exit 1
          fi

          echo "Keystore oficial confirmada."

      - name: Alinhar e assinar APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          RELEASE_DIR="release-artifacts"
          mkdir -p "$RELEASE_DIR"

          UNSIGNED_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"

          if [ ! -f "$UNSIGNED_APK" ]; then
            UNSIGNED_APK="$(
              find android/app/build/outputs/apk/release \
                -maxdepth 1 \
                -type f \
                -name '*.apk' \
                | head -n 1
            )"
          fi

          if [ -z "${UNSIGNED_APK:-}" ] || [ ! -f "$UNSIGNED_APK" ]; then
            echo "::error::APK Release não foi encontrado."
            exit 1
          fi

          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/36.0.0"

          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          AAPT="$BUILD_TOOLS/aapt"

          test -x "$ZIPALIGN"
          test -x "$APKSIGNER"
          test -x "$AAPT"

          ALIGNED_APK="$RUNNER_TEMP/NVU-R3.34-aligned.apk"
          SIGNED_APK="$RELEASE_DIR/NVU-R3.34-release.apk"

          "$ZIPALIGN" \
            -p \
            -f \
            4 \
            "$UNSIGNED_APK" \
            "$ALIGNED_APK"

          "$APKSIGNER" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$SIGNED_APK" \
            | tee "$RELEASE_DIR/signing-report.txt"

      - name: Validar APK final
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          AAPT="$BUILD_TOOLS/aapt"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          APK="release-artifacts/NVU-R3.34-release.apk"

          test -f "$APK"

          BADGING="$("$AAPT" dump badging "$APK" | head -n 1)"

          echo "$BADGING" \
            | tee release-artifacts/package-badging.txt

          echo "$BADGING" \
            | grep -Fq "package: name='$EXPECTED_APPLICATION_ID'"

          echo "$BADGING" \
            | grep -Fq "versionCode='$EXPECTED_VERSION_CODE'"

          echo "$BADGING" \
            | grep -Fq "versionName='$EXPECTED_VERSION_NAME'"

          CERT_SHA="$(
            "$APKSIGNER" verify \
              --print-certs \
              "$APK" \
            | sed -n \
              's/^Signer #1 certificate SHA-256 digest: //p' \
            | head -n 1 \
            | tr -d '[:space:]:-' \
            | tr '[:lower:]' '[:upper:]'
          )"

          EXPECTED="$(
            printf '%s' "$EXPECTED_SIGNING_CERT_SHA256" \
            | tr -d '[:space:]:-' \
            | tr '[:lower:]' '[:upper:]'
          )"

          if [ "$CERT_SHA" != "$EXPECTED" ]; then
            echo "::error::Certificado do APK final não corresponde à chave oficial."
            exit 1
          fi

          echo "$CERT_SHA" \
            > release-artifacts/signing-cert-sha256.txt

          sha256sum "$APK" \
            | tee release-artifacts/NVU-R3.34-release.apk.sha256

          cat > release-artifacts/release-info.txt <<EOF
          NVU R3.34
          applicationId=$EXPECTED_APPLICATION_ID
          versionName=$EXPECTED_VERSION_NAME
          versionCode=$EXPECTED_VERSION_CODE
          signingCertificateSHA256=$CERT_SHA
          workflowRun=$GITHUB_RUN_ID
          gitCommit=$GITHUB_SHA
          EOF

          echo "APK Release validado com sucesso."

      - name: Apagar material temporário de assinatura
        if: always()
        shell: bash
        run: |
          rm -f "${KEYSTORE_PATH:-}"
          rm -f "$RUNNER_TEMP/NVU-R3.34-aligned.apk"

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: NVU-R3.34-release
          path: extracted/NVU-CAPACITOR-ANDROID-R3.34/release-artifacts/
          if-no-files-found: error
          retention-days: 30
