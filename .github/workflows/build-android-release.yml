name: Build NVU R3.34 PC-HF62 OTA359 Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nvu-r3-34-pc-hf62-android-release
  cancel-in-progress: false

jobs:
  build-release:
    name: R3.34 OTA359 signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      EXPECTED_APPLICATION_ID: com.nvu.operacional
      EXPECTED_VERSION_CODE: "359"
      EXPECTED_VERSION_NAME: "1.0.359"
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      EXPECTED_SIGNING_CERT_SHA256: ${{ vars.EXPECTED_SIGNING_CERT_SHA256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate signing secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured in Settings > Secrets and variables > Actions."
              exit 1
            fi
          done

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --licenses >/dev/null || true

      - name: Install project dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm --prefix functions ci
          npm --prefix functions run build

      - name: Validate R3.34 PC-HF62 source
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:release

      - name: Build and synchronize Capacitor assets
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          npm run prepare:cap-assets
          npx cap sync android
          npm run verify:cap-assets

      - name: Verify expected Android identity before build
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'applicationId "com.nvu.operacional"' android/app/build.gradle
          grep -Fq 'versionCode 359' android/app/build.gradle
          grep -Fq 'versionName "1.0.359"' android/app/build.gradle
          echo "Android identity verified: $EXPECTED_APPLICATION_ID / $EXPECTED_VERSION_NAME ($EXPECTED_VERSION_CODE)"

      - name: Build unsigned release APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          cd android
          ./gradlew --stop || true
          ./gradlew clean assembleRelease --no-daemon

      - name: Verify preserved approved voice assets
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-hf60-voice-apk.py

      - name: Decode temporary signing keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/nvu-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Zipalign and sign release APK
        shell: bash
        run: |
          set -euo pipefail

          UNSIGNED_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$UNSIGNED_APK" ]; then
            UNSIGNED_APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          fi
          if [ -z "${UNSIGNED_APK:-}" ] || [ ! -f "$UNSIGNED_APK" ]; then
            echo "::error::Release APK was not produced by Gradle."
            exit 1
          fi

          BUILD_TOOLS_DIR="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          AAPT="$BUILD_TOOLS_DIR/aapt"
          test -x "$ZIPALIGN"
          test -x "$APKSIGNER"
          test -x "$AAPT"

          mkdir -p release-artifacts
          ALIGNED_APK="$RUNNER_TEMP/NVU-R3.34-OTA359-aligned.apk"
          SIGNED_APK="release-artifacts/NVU-R3.34-OTA359-release.apk"

          "$ZIPALIGN" -p -f 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$APKSIGNER" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          "$APKSIGNER" verify --verbose --print-certs "$SIGNED_APK" | tee release-artifacts/signing-report.txt

          BADGING="$($AAPT dump badging "$SIGNED_APK" | head -n 1)"
          echo "$BADGING" | tee release-artifacts/package-badging.txt
          echo "$BADGING" | grep -Fq "package: name='$EXPECTED_APPLICATION_ID'"
          echo "$BADGING" | grep -Fq "versionCode='$EXPECTED_VERSION_CODE'"
          echo "$BADGING" | grep -Fq "versionName='$EXPECTED_VERSION_NAME'"

          CERT_SHA256="$($APKSIGNER verify --print-certs "$SIGNED_APK" | sed -nE 's/^.*certificate SHA-256 digest:[[:space:]]*//p' | head -n 1 | tr -d '[:space:]:-' | tr '[:lower:]' '[:upper:]')"
          if [ -z "$CERT_SHA256" ]; then
            echo "::error::Could not read the APK signing certificate SHA-256."
            exit 1
          fi
          echo "$CERT_SHA256" > release-artifacts/signing-cert-sha256.txt

          if [ -n "${EXPECTED_SIGNING_CERT_SHA256:-}" ]; then
            EXPECTED="$(printf '%s' "$EXPECTED_SIGNING_CERT_SHA256" | tr -d '[:space:]:-' | tr '[:lower:]' '[:upper:]')"
            if [ "$CERT_SHA256" != "$EXPECTED" ]; then
              echo "::error::Signing certificate does not match EXPECTED_SIGNING_CERT_SHA256. Build rejected."
              exit 1
            fi
            echo "Signing certificate matches the configured production certificate."
          else
            echo "::warning::EXPECTED_SIGNING_CERT_SHA256 is not configured. APK signature is valid, but production-certificate pinning was not checked."
          fi

          sha256sum "$SIGNED_APK" | tee release-artifacts/NVU-R3.34-OTA359-release.apk.sha256
          cat > release-artifacts/release-info.txt <<EOF
          NVU R3.34-OTA359 (Web 2.3.141, Senior monetary audit fields and production-359 channel)
          applicationId=$EXPECTED_APPLICATION_ID
          versionName=$EXPECTED_VERSION_NAME
          versionCode=$EXPECTED_VERSION_CODE
          signingCertificateSHA256=$CERT_SHA256
          workflowRun=$GITHUB_RUN_ID
          gitCommit=$GITHUB_SHA
          EOF

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          rm -f "${KEYSTORE_PATH:-}" "$RUNNER_TEMP/NVU-R3.34-OTA359-aligned.apk"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: NVU-R3.34-OTA359-release
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30
