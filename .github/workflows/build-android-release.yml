name: Build NVU R3.35 Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nvu-r3-35-release
  cancel-in-progress: false

jobs:
  build-release:
    name: Gerar APK Release Assinado
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      EXPECTED_ZIP_SHA256: 43583f5905163f5f3c78b0502c40b1ebb73931696a41b5c1495be1ad83f1bebb
      EXPECTED_APPLICATION_ID: com.nvu.operacional
      EXPECTED_VERSION_CODE: "52"
      EXPECTED_VERSION_NAME: "1.0.52"
      EXPECTED_SIGNING_CERT_SHA256: "80:6A:03:EA:92:B6:9E:7F:9A:70:52:6E:9C:4D:6A:4A:E5:2E:C4:F9:CF:7C:AC:05:DD:B1:AA:28:08:42:46:EA"

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Validar ZIP R3.35
        shell: bash
        run: |
          set -euo pipefail

          echo "Procurando ZIP certificado da R3.35..."

          FOUND_ZIP=""

          while IFS= read -r -d '' FILE; do
            ACTUAL_SHA="$(sha256sum "$FILE" | awk '{print $1}')"

            echo "Arquivo encontrado: $(basename "$FILE")"
            echo "SHA-256: $ACTUAL_SHA"

            if [ "$ACTUAL_SHA" = "$EXPECTED_ZIP_SHA256" ]; then
              FOUND_ZIP="$FILE"
              break
            fi
          done < <(
            find "$GITHUB_WORKSPACE" \
              -maxdepth 1 \
              -type f \
              -iname '*.zip' \
              -print0
          )

          if [ -z "$FOUND_ZIP" ]; then
            echo "::error::Nenhum ZIP corresponde à R3.35 certificada."
            echo "::error::SHA esperado: $EXPECTED_ZIP_SHA256"
            exit 1
          fi

          echo "ZIP R3.35 encontrado: $FOUND_ZIP"

          echo "ZIP_FILE=$FOUND_ZIP" >> "$GITHUB_ENV"

      - name: Extrair projeto
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR="$GITHUB_WORKSPACE/extracted/NVU-CAPACITOR-ANDROID-R3.35"

          if [ ! -f "$PROJECT_DIR/package.json" ]; then
            echo "::error::package.json não encontrado na pasta esperada."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/package-lock.json" ]; then
            echo "::error::package-lock.json não encontrado."
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/android" ]; then
            echo "::error::Pasta android não encontrada."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/android/gradlew" ]; then
            echo "::error::Gradle Wrapper não encontrado."
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/functions" ]; then
            echo "::error::Pasta functions não encontrada."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Projeto R3.35 extraído corretamente."

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Instalar dependências
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          npm ci
          npm --prefix functions ci

      - name: Executar certificação R3.35
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          npm run verify:release

      - name: Compilar Web e sincronizar Capacitor
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          npm run build
          npm run prepare:cap-assets
          npx cap sync android
          npm run verify:cap-assets

      - name: Validar identidade Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if ! grep -Fq 'applicationId "com.nvu.operacional"' android/app/build.gradle; then
            echo "::error::applicationId incorreto."
            exit 1
          fi

          if ! grep -Fq 'versionCode 52' android/app/build.gradle; then
            echo "::error::versionCode incorreto."
            exit 1
          fi

          if ! grep -Fq 'versionName "1.0.52"' android/app/build.gradle; then
            echo "::error::versionName incorreto."
            exit 1
          fi

          echo "Pacote confirmado: $EXPECTED_APPLICATION_ID"
          echo "versionCode confirmado: $EXPECTED_VERSION_CODE"
          echo "versionName confirmado: $EXPECTED_VERSION_NAME"

      - name: Compilar APK Release
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR/android"

          chmod +x gradlew

          ./gradlew --stop || true

          ./gradlew \
            clean \
            assembleRelease \
            --no-daemon

          echo "APK Release compilado."

      - name: Validar Secrets de assinatura
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 não configurado."
            exit 1
          fi

          if [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD não configurado."
            exit 1
          fi

          if [ -z "${ANDROID_KEY_ALIAS:-}" ]; then
            echo "::error::ANDROID_KEY_ALIAS não configurado."
            exit 1
          fi

          if [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "::error::ANDROID_KEY_PASSWORD não configurado."
            exit 1
          fi

          echo "Secrets de assinatura encontrados."

      - name: Reconstruir keystore temporária
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          KEYSTORE_PATH="$RUNNER_TEMP/nvu-release.jks"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$KEYSTORE_PATH"

          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Falha ao reconstruir a keystore."
            exit 1
          fi

          chmod 600 "$KEYSTORE_PATH"

          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

          echo "Keystore reconstruída."

      - name: Validar certificado da keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          EXPECTED_CERT="$(
            printf '%s' "$EXPECTED_SIGNING_CERT_SHA256" \
              | tr -d '[:space:]:-' \
              | tr '[:lower:]' '[:upper:]'
          )"

          ACTUAL_CERT="$(
            keytool \
              -list \
              -v \
              -keystore "$KEYSTORE_PATH" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -alias "$ANDROID_KEY_ALIAS" \
              | sed -n 's/.*SHA256: //p' \
              | head -n 1 \
              | tr -d '[:space:]:-' \
              | tr '[:lower:]' '[:upper:]'
          )"

          if [ -z "$ACTUAL_CERT" ]; then
            echo "::error::Não foi possível identificar o certificado."
            exit 1
          fi

          if [ "$ACTUAL_CERT" != "$EXPECTED_CERT" ]; then
            echo "::error::A keystore não corresponde à chave oficial da NVU."
            exit 1
          fi

          echo "Certificado oficial da NVU confirmado."

      - name: Alinhar e assinar APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          RELEASE_DIR="$PROJECT_DIR/release-artifacts"

          mkdir -p "$RELEASE_DIR"

          UNSIGNED_APK="$PROJECT_DIR/android/app/build/outputs/apk/release/app-release-unsigned.apk"

          if [ ! -f "$UNSIGNED_APK" ]; then
            UNSIGNED_APK="$(
              find "$PROJECT_DIR/android/app/build/outputs/apk/release" \
                -maxdepth 1 \
                -type f \
                -name '*.apk' \
                | head -n 1
            )"
          fi

          if [ -z "${UNSIGNED_APK:-}" ]; then
            echo "::error::Nenhum APK Release encontrado."
            exit 1
          fi

          if [ ! -f "$UNSIGNED_APK" ]; then
            echo "::error::Arquivo APK Release não existe."
            exit 1
          fi

          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/36.0.0"

          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          if [ ! -x "$ZIPALIGN" ]; then
            echo "::error::zipalign não encontrado."
            exit 1
          fi

          if [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner não encontrado."
            exit 1
          fi

          ALIGNED_APK="$RUNNER_TEMP/NVU-R3.35-aligned.apk"

          SIGNED_APK="$RELEASE_DIR/NVU-R3.35-release.apk"

          echo "APK de origem:"
          echo "$UNSIGNED_APK"

          "$ZIPALIGN" \
            -p \
            -f \
            4 \
            "$UNSIGNED_APK" \
            "$ALIGNED_APK"

          "$APKSIGNER" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$SIGNED_APK" \
            | tee "$RELEASE_DIR/signing-report.txt"

          if [ ! -s "$SIGNED_APK" ]; then
            echo "::error::APK assinado não foi criado."
            exit 1
          fi

          echo "APK R3.35 alinhado e assinado com sucesso."

      - name: Validar APK final
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          RELEASE_DIR="$PROJECT_DIR/release-artifacts"

          APK="$RELEASE_DIR/NVU-R3.35-release.apk"

          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/36.0.0"

          AAPT="$BUILD_TOOLS/aapt"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          if [ ! -f "$APK" ]; then
            echo "::error::APK final não encontrado."
            exit 1
          fi

          BADGING="$("$AAPT" dump badging "$APK" | head -n 1)"

          printf '%s\n' "$BADGING" \
            | tee "$RELEASE_DIR/package-badging.txt"

          if ! printf '%s\n' "$BADGING" \
            | grep -Fq "package: name='$EXPECTED_APPLICATION_ID'"; then

            echo "::error::applicationId final incorreto."
            exit 1
          fi

          if ! printf '%s\n' "$BADGING" \
            | grep -Fq "versionCode='$EXPECTED_VERSION_CODE'"; then

            echo "::error::versionCode final incorreto."
            exit 1
          fi

          if ! printf '%s\n' "$BADGING" \
            | grep -Fq "versionName='$EXPECTED_VERSION_NAME'"; then

            echo "::error::versionName final incorreto."
            exit 1
          fi

          CERT_SHA="$(
            "$APKSIGNER" \
              verify \
              --print-certs \
              "$APK" \
              | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
              | head -n 1 \
              | tr -d '[:space:]:-' \
              | tr '[:lower:]' '[:upper:]'
          )"

          EXPECTED_CERT="$(
            printf '%s' "$EXPECTED_SIGNING_CERT_SHA256" \
              | tr -d '[:space:]:-' \
              | tr '[:lower:]' '[:upper:]'
          )"

          if [ "$CERT_SHA" != "$EXPECTED_CERT" ]; then
            echo "::error::Certificado do APK final incorreto."
            exit 1
          fi

          printf '%s\n' "$CERT_SHA" \
            > "$RELEASE_DIR/signing-cert-sha256.txt"

          sha256sum "$APK" \
            | tee "$RELEASE_DIR/NVU-R3.35-release.apk.sha256"

          {
            echo "NVU R3.35"
            echo "applicationId=$EXPECTED_APPLICATION_ID"
            echo "versionName=$EXPECTED_VERSION_NAME"
            echo "versionCode=$EXPECTED_VERSION_CODE"
            echo "signingCertificateSHA256=$CERT_SHA"
            echo "workflowRun=$GITHUB_RUN_ID"
            echo "gitCommit=$GITHUB_SHA"
          } > "$RELEASE_DIR/release-info.txt"

          echo "APK R3.35 final validado com sucesso."

      - name: Apagar material temporário
        if: always()
        shell: bash
        run: |
          rm -f "${KEYSTORE_PATH:-}"
          rm -f "$RUNNER_TEMP/NVU-R3.35-aligned.apk"

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: NVU-R3.35-release
          path: extracted/NVU-CAPACITOR-ANDROID-R3.35/release-artifacts/
          if-no-files-found: error
          retention-days: 30
